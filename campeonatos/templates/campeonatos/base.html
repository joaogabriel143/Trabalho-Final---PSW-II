<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            LigaHub
        {% endblock %}
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #1b5e20;
            color: white;
            padding: 18px 30px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            margin-right: 18px;
            text-decoration: none;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }

        .botao {
            display: inline-block;
            background: #1b5e20;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .acoes {
            margin: 20px 0;
        }

        form p {
            margin-bottom: 18px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            max-width: 500px;
            padding: 9px;
            box-sizing: border-box;
        }

        .erro {
            color: #b00020;
        }
    </style>
</head>

<body>

<header>

    <strong>LigaHub</strong>

    <nav>
        <a href="{% url 'campeonatos:inicio' %}">
            Início
        </a>

        <a href="{% url 'campeonatos:campeonato_listar' %}">
            Campeonatos
        </a>

        <a href="{% url 'campeonatos:inscricao_listar' %}">
            Inscrições
        </a>

        <a href="{% url 'campeonatos:partida_listar' %}">
            Partidas
        </a>
    </nav>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
