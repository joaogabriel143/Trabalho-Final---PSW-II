<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        LigaHub
        {% endblock %}
    </title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }


        header {
            background-color: #1f2937;
            color: white;
            padding: 20px;
        }


        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }


        nav a {
            color: white;
            text-decoration: none;
        }


        nav a:hover {
            text-decoration: underline;
        }


        .usuario {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }


        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
        }


        .botao {
            display: inline-block;
            background-color: #1f2937;
            color: white;
            padding: 10px 16px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            border-radius: 4px;
        }


        .botao:hover {
            opacity: 0.9;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }


        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }


        th {
            background-color: #eee;
        }


        .escudo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }


        .logout-form {
            display: inline;
            margin: 0;
        }


        .logout {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0;
            font-size: inherit;
        }


        .logout:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<header>

    <h1>LigaHub</h1>


    <nav>

        <a href="{% url 'campeonatos:inicio' %}">
            Início
        </a>


        <a href="{% url 'campeonatos:campeonato_listar' %}">
            Campeonatos
        </a>


        <a href="{% url 'campeonatos:time_listar' %}">
            Times
        </a>


        <a href="{% url 'campeonatos:pessoa_listar' %}">
            Pessoas
        </a>


        <a href="{% url 'campeonatos:estadio_listar' %}">
            Estádios
        </a>


        <a href="{% url 'campeonatos:inscricao_listar' %}">
            Inscrições
        </a>


        <a href="{% url 'campeonatos:partida_listar' %}">
            Partidas
        </a>


        <a href="{% url 'campeonatos:elenco_listar' %}">
            Elencos
        </a>



        <div class="usuario">

            {% if request.user.is_authenticated %}

                <span>
                    Usuário:
                    {{ request.user.username }}
                </span>


                <form
                    method="post"
                    action="{% url 'campeonatos:logout' %}"
                    class="logout-form"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="logout"
                    >
                        Sair
                    </button>

                </form>


            {% else %}


                <a href="{% url 'campeonatos:login' %}">
                    Entrar
                </a>


                <a href="{% url 'campeonatos:criar_conta' %}">
                    Criar conta
                </a>


            {% endif %}

        </div>

    </nav>

</header>



<main>

    {% block content %}

    {% endblock %}

</main>


</body>

</html>
