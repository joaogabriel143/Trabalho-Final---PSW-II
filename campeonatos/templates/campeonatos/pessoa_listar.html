{% extends "campeonatos/base.html" %}


{% block title %}
    Pessoas | LigaHub
{% endblock %}


{% block content %}

<h1>Pessoas</h1>


<div class="acoes">

    <a
        class="botao"
        href="{% url 'campeonatos:pessoa_criar' %}"
    >
        Nova pessoa
    </a>

</div>


<table>

    <thead>

        <tr>
            <th>Nome</th>
            <th>Data de nascimento</th>
        </tr>

    </thead>


    <tbody>

        {% for pessoa in pessoas %}

            <tr>

                <td>
                    {{ pessoa.nome }}
                </td>

                <td>
                    {{ pessoa.data_nascimento }}
                </td>

            </tr>

        {% empty %}

            <tr>

                <td colspan="2">
                    Nenhuma pessoa cadastrada.
                </td>

            </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
